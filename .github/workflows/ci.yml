name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Unit Tests
      run: dotnet test ApiPruebaAsis.UnitTests/ApiPruebaAsis.UnitTests.csproj --no-build --configuration Release

    - name: Integration Tests
      run: dotnet test ApiPruebaAsis.IntegrationTests/ApiPruebaAsis.IntegrationTests.csproj --no-build --configuration Release

    - name: Publish
      run: dotnet publish ApiPruebaAsis/ApiPruebaAsis.csproj -c Release